<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live scores</title>
<style>
:root{--bg:#0b1220;--card:#111b2e;--line:#22314d;--tx:#e8eefb;--mut:#8a9bb8;--me:#6cc4ff;--op:#ffb347;--live:#7be36a;--gold:#d4a017}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;padding:14px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0 8px 0 0}
input,button,select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit}
input[type=range]{padding:0;accent-color:var(--me);width:140px}
button{cursor:pointer}
.key{font-size:13px;color:var(--mut)}.key b.m{color:var(--me)}.key b.o{color:var(--op)}
#buf{color:var(--op);font-weight:600}#st{color:var(--mut);font-size:12px;margin-left:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:14px}
.panel h2{font-size:15px;margin:0 0 8px}
.chips{margin-bottom:10px;font-size:13px}
.chips summary{cursor:pointer;padding:4px 0}
.lt{display:flex;gap:6px;margin:6px 0}.lt button{padding:2px 10px;font-size:12px;border-radius:14px}
.ll{display:grid;gap:6px;max-height:220px;overflow:auto;padding:2px 2px 6px}
.ll label{display:flex;gap:8px;align-items:center;font-size:13px}
.ll span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#feed{max-height:340px;overflow:auto}
.play{border-left:3px solid var(--line);padding:5px 10px;margin-bottom:8px;background:#0e1829;border-radius:0 6px 6px 0}
.play.td{border:1px solid var(--gold);border-left-width:3px;background:rgba(212,160,23,.16);border-radius:6px}
.play.fg{border-left-color:var(--gold)}
.lb{font-weight:700;font-size:14px}.lb.sm{font-size:12px;color:var(--gold)}
.pm{color:var(--mut);font-size:12px}
.pt{margin:2px 0 4px}
.tags span{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;margin:0 6px 3px 0;border:1px solid}
.tags .me{color:var(--me);border-color:var(--me)}.tags .op{color:var(--op);border-color:var(--op)}
.f{border-left:3px solid;padding:3px 10px;margin-bottom:6px;font-size:13px}
.f.me{border-color:var(--me)}.f.op{border-color:var(--op)}
.f b{margin-right:6px}.f.me b{color:var(--me)}.f.op b{color:var(--op)}
.f small{color:var(--mut);margin-left:6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.lg{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
.hd{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.hd b,.hd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd span{color:var(--mut)}
.sc{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 2px;font-size:26px;font-weight:700}
.sc .me{color:var(--me)}.sc .op{color:var(--op)}.sc .lead{font-size:13px;font-weight:600;color:var(--mut)}
.wc{text-align:center;font-size:12px;color:var(--mut);margin-bottom:8px}.wc b{color:var(--tx)}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r{display:flex;gap:5px;align-items:baseline;font-size:12.5px;padding:1px 0}
.r i{font-style:normal;color:var(--mut);width:30px;flex:none;font-size:11px}
.r span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r span.lv{color:var(--live);font-weight:600}
.r b{font-variant-numeric:tabular-nums}
.me .r b{color:var(--me)}.op .r b{color:var(--op)}
.fpd{margin-top:4px;font-size:12px}.fpd summary{cursor:pointer;color:var(--mut)}
.fph{margin-top:6px;font-weight:600}
.fp{display:flex;justify-content:space-between;gap:8px;padding:1px 0}.fp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp.me b{color:var(--me)}.fp.op b{color:var(--op)}
.fp small{color:var(--mut);font-weight:400}
.empty{color:var(--mut)}
body.feedonly{display:flex;flex-direction:column;height:100vh;overflow:hidden;padding:10px}
body.feedonly header{flex:none;margin-bottom:8px;gap:6px}
body.feedonly h1,body.feedonly .leg{display:none}
body.feedonly #st{margin-left:0;font-size:11px}
body.feedonly #u{width:130px}
body.feedonly .wrap{display:flex;flex:1;min-height:0}
body.feedonly #grid{display:none}
body.feedonly .panel{position:static;margin:0;flex:1;display:flex;flex-direction:column;min-height:0}
body.feedonly #feed{flex:1;max-height:none;min-height:0}
body.cardsonly .panel{display:none}
body.cardsonly .wrap{display:block}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px;padding:6px 10px;font-size:13px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{border-color:var(--me);color:var(--me);position:relative}
#ff{margin-bottom:10px}#ff button{font-size:12px;padding:4px 9px}
@media(min-width:1000px){
  body{font-size:15px;padding:20px}
  .wrap{display:grid;grid-template-columns:minmax(360px,430px) 1fr;gap:18px;align-items:start}
  .panel{position:sticky;top:12px;margin-bottom:0}
  #feed{max-height:calc(100vh - 190px)}
  #grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .r{font-size:14px}.sc{font-size:30px}
}
</style></head>
<body>
<header>
  <h1>Live scores</h1>
  <input id="u" value="chrispalmer33" aria-label="Sleeper username" autocomplete="off">
  <select id="wk" aria-label="Week"></select>
  <button id="go">Load</button>
  <span class="seg" id="vw"><button data-v="both">Both</button><button data-v="feed">Feed only</button><button data-v="cards">Cards only</button></span>
  <label class="key">Delay <input id="d" type="range" min="0" max="180" step="5"> <b id="dl"></b></label>
  <span class="key leg"><b class="m">You</b> · <b class="o">Opponent</b></span>
  <span id="buf"></span><span id="st"></span>
</header>
<div class="wrap">
<section class="panel"><h2>Live scoring</h2><div class="seg" id="ff"><button data-f="all">All plays</button><button data-f="mine">Helps you</button><button data-f="opp">Helps opponents</button></div><div id="chips" class="chips"></div><div id="feed"><div class="empty">Plays and score changes involving your players appear here after the delay.</div></div></section>
<main id="grid"><div class="empty">Loading your leagues…</div></main>
</div>
<script>
const $=s=>document.querySelector(s),A='https://api.sleeper.app/v1',E='https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const j=async u=>{const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.json()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[.'’]/g,'').replace(/-/g,' ').replace(/\b(jr|sr|ii|iii|iv)\b/g,'').replace(/\s+/g,' ').trim();
const sn=s=>String(s||'').toLowerCase().replace(/[’']/g,'').replace(/\./g,' ').replace(/-/g,' ').replace(/\b(jr|sr|ii|iii|iv)\b/g,'').replace(/\s+/g,' ').trim();
const nt=t=>({WSH:'WAS',LAR:'LA'}[t]||t);
const pts=(st,sc)=>Object.keys(st).reduce((a,k)=>a+(sc[k]?st[k]*sc[k]:0),0);
const POS={SUPER_FLEX:'SFLX',FLEX:'FLX',REC_FLEX:'FLX',WRRB_FLEX:'FLX',WRRBTE_FLEX:'FLX'};
const get=k=>{try{return localStorage.getItem(k)}catch{return null}};
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let players,user,Ls=[],snaps=[],shown=null,feed=[],wk=null,curWk=null,season=null,selWk='auto',pt,seq=0,lastSig='',
    seen=new Set(),seenEv=new Set(),projC={w:0,t:0,m:{}},delay=+(get('delay')??45),
    off=new Set(JSON.parse(get('off')||'[]'));
if(get('user'))$('#u').value=get('user');
$('#d').value=delay;$('#dl').textContent=delay+'s';
$('#wk').innerHTML='<option value="auto">Current week</option>'+Array.from({length:18},(_,i)=>`<option value="${i+1}">Week ${i+1}</option>`).join('');

const pn=pid=>{const p=players[pid]||{};return p.full_name||((p.first_name||'')+' '+(p.last_name||'')).trim()||pid};
const clock=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});
function reset(){snaps=[];shown=null;feed=[];seen.clear();seenEv.clear();lastSig='';wk=null}

function setChips(){
  $('#chips').innerHTML=`<details><summary>Leagues in feed: <b id="lc"></b></summary><div class="lt"><button data-a="all">All</button><button data-a="none">None</button></div><div class="ll">${Ls.map((L,i)=>`<label><input type="checkbox" data-i="${i}"><span>${esc(L.name)}</span></label>`).join('')}</div></details>`;
  syncChecks();
}
function syncChecks(){
  document.querySelectorAll('#chips input').forEach(i=>i.checked=!off.has(Ls[+i.dataset.i].name));
  const c=$('#lc');if(c)c.textContent=`${Ls.filter(L=>!off.has(L.name)).length} of ${Ls.length}`;
}
function offChanged(){put('off',JSON.stringify([...off]));syncChecks();lastSig='';renderFeed()}
$('#chips').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a==='all')off.clear();else Ls.forEach(L=>off.add(L.name));
  offChanged();
};
$('#chips').onchange=e=>{
  const i=e.target.closest('input');if(!i)return;
  const n=Ls[+i.dataset.i].name;i.checked?off.delete(n):off.add(n);
  offChanged();
};


async function getProj(w){
  if(projC.w===w&&Date.now()-projC.t<300000)return projC.m;
  try{const a=await j(`https://api.sleeper.com/projections/nfl/${season}/${w}?season_type=regular`);const m={};a.forEach(p=>m[p.player_id]=p.stats||{});projC={w,t:Date.now(),m}}
  catch{if(projC.w!==w)projC={w,t:Date.now()-240000,m:{}}}
  return projC.m;
}

async function init(){
  $('#st').textContent='Loading leagues…';
  try{
    const name=$('#u').value.trim();put('user',name);
    const st=await j(A+'/state/nfl');season=st.season;
    user=await j(`${A}/user/${name}`);
    const leagues=await j(`${A}/user/${user.user_id}/leagues/nfl/${st.season}`);
    players ||= await j(A+'/players/nfl');
    Ls=(await Promise.all(leagues.map(async L=>{
      const [rs,us]=await Promise.all([j(`${A}/league/${L.league_id}/rosters`),j(`${A}/league/${L.league_id}/users`)]);
      const me=rs.find(r=>r.owner_id===user.user_id||(r.co_owners||[]).includes(user.user_id));
      if(!me)return null;
      const owner={},uname={};
      rs.forEach(r=>owner[r.roster_id]=r.owner_id);
      us.forEach(u=>uname[u.user_id]=u.metadata?.team_name||u.display_name);
      return {id:L.league_id,name:L.name,sc:L.scoring_settings||{},pos:L.roster_positions||[],me:me.roster_id,owner,uname};
    }))).filter(Boolean);
    setChips();reset();
    await poll();clearInterval(pt);pt=setInterval(poll,15000);
  }catch(e){$('#st').textContent='';$('#grid').innerHTML=`<div class="empty">Couldn't load: ${esc(e.message)}. Check the username and your connection.</div>`}
}

async function poll(){
  try{
    const st=await j(A+'/state/nfl');season=st.season;curWk=st.display_week||st.week;
    const w=selWk==='auto'?curWk:+selWk;
    if(wk!==null&&w!==wk)reset();
    wk=w;
    const sb=w===curWk?await j(E+'/scoreboard').catch(()=>null):null;
    const live={},gs={};
    for(const e of sb?.events||[])for(const c of e.competitions[0].competitors){
      const t=nt(c.team.abbreviation);gs[t]=e.status.type.state;if(gs[t]==='in')live[t]=true}
    const pm=await getProj(w);
    const tm=pid=>nt(players[pid]?.team);
    const out=await Promise.all(Ls.map(async L=>{
      const ms=await j(`${A}/league/${L.id}/matchups/${w}`);
      const mm=ms.find(m=>m.roster_id===L.me);
      if(!mm)return null;
      const op=mm.matchup_id&&ms.find(m=>m.matchup_id===mm.matchup_id&&m.roster_id!==L.me);
      const side=m=>m&&{total:m.points||0,rows:(m.starters||[]).map((p,i)=>[p,(m.players_points||{})[p]||0,L.pos[i],!!live[tm(p)]])};
      const val=(pid,m)=>{const s=gs[tm(pid)],cur=(m.players_points||{})[pid]||0,pr=pts(pm[pid]||{},L.sc);
        if(!s||s==='post')return [cur,0];return s==='in'?[Math.max(cur,pr),.3*pr]:[pr,.5*pr]};
      const ev=m=>{let t=0,v=0;for(const p of m.starters||[]){if(!p||p==='0')continue;const [x,s]=val(p,m);t+=x;v+=s*s}return [t,v]};
      let wp=null;
      if(op&&(sb||w!==curWk)){
        const [a,va]=ev(mm),[b,vb]=ev(op),sd=Math.sqrt(va+vb);
        wp=sd<.5?(a>b?100:a<b?0:50):100/(1+Math.exp(-1.702*(a-b)/sd));
      }
      return {name:L.name,opp:op?(L.uname[L.owner[op.roster_id]]||'Opponent'):'No opponent',me:side(mm),op:side(op),wp};
    }));
    const now=Date.now();
    snaps.push({t:now,data:out.filter(Boolean)});
    snaps=snaps.filter(s=>s.t>now-300000);
    $('#st').textContent=`Week ${w} · ${Ls.length} leagues · polled ${clock(now)}`;
    if(sb)await pollPlays(sb).catch(()=>{});
  }catch(e){$('#st').textContent='Fetch error: '+e.message}
}

function index(){
  const m={},c=snaps[snaps.length-1];
  if(!c)return [];
  for(const l of c.data)for(const s of ['me','op'])if(l[s])for(const [pid] of l[s].rows){
    if(!pid||pid==='0'||/^[A-Z]{2,3}$/.test(pid))continue;
    const pl=players[pid]||{},fi=sn(pl.first_name).charAt(0),ln=sn(pl.last_name);
    const e=m[pid]??={n:sn(pn(pid)),name:pn(pid),pos:pl.position||'',tm:nt(pl.team),ab:fi&&ln?new RegExp('\\b'+fi+' '+ln+'\\b'):/$^/,yl:[],al:[]};
    (s==='me'?e.yl:e.al).push(l.name);
  }
  return Object.values(m).filter(e=>e.n.includes(' '));
}

async function pollPlays(sb){
  const live=(sb.events||[]).filter(e=>e.status.type.state==='in');
  const idx=index();
  await Promise.all(live.map(async e=>{
    const d=await j(`${E}/summary?event=${e.id}`);
    const drives=[...(d.drives?.previous||[]),...(d.drives?.current?[d.drives.current]:[])];
    const first=!seenEv.has(e.id);seenEv.add(e.id);
    const cp=e.competitions[0].competitors,ab=h=>cp.find(c=>c.homeAway===h)?.team.abbreviation||'',tms=cp.map(c=>nt(c.team.abbreviation));
    for(const dr of drives)for(const p of dr.plays||[]){
      const key=e.id+':'+p.id;
      if(seen.has(key))continue;
      seen.add(key);
      if(first)continue;
      const txt=sn(p.text);
      const hits=idx.filter(x=>tms.includes(x.tm)&&(txt.includes(x.n)||x.ab.test(txt))),sts=playStats(p,txt,hits);
      const ps=hits.map((x,i)=>({name:x.name,pos:x.pos,yl:x.yl,al:x.al,st:sts[i]}));
      if(!ps.length)continue;
      const low=String(p.text||'').toLowerCase(),k=p.scoringPlay?(/touchdown/.test(low)?'td':/field goal/.test(low)?'fg':''):'';
      const sc=(p.awayScore!=null&&p.homeScore!=null)?`${ab('away')} ${p.awayScore} – ${ab('home')} ${p.homeScore}`:'';
      feed.push({kind:'play',t:Date.now(),n:++seq,text:p.text,dd:p.start?.downDistanceText||'',
        q:p.period?.number?'Q'+p.period.number:'',clk:p.clock?.displayValue||'',sc,k,ps});
    }
  }));
}

function diff(a,b){
  if(!a)return;
  b.data.forEach((lb,i)=>{
    const la=a.data[i];if(!la||la.name!==lb.name)return;
    for(const s of ['me','op']){
      if(!la[s]||!lb[s])continue;
      const prev={};la[s].rows.forEach(r=>prev[r[0]]=r[1]);
      for(const [pid,p] of lb[s].rows){
        const d=p-(prev[pid]??p);
        if(Math.abs(d)>=0.05)feed.push({kind:'pts',t:b.t,n:++seq,s,d,name:pn(pid),lg:lb.name});
      }
    }
  });
  feed=feed.slice(-300);
}

const f1=v=>v.toFixed(1);
function col(side,cls){
  if(!side)return `<div class="${cls}"></div>`;
  return `<div class="${cls}">${side.rows.map(([pid,p,pos,lv])=>`<div class="r"><i>${esc(POS[pos]||pos||'')}</i><span class="${lv?'lv':''}">${esc(pn(pid))}</span><b>${f1(p)}</b></div>`).join('')}</div>`;
}
function render(c){
  $('#grid').innerHTML=c.data.map(l=>{
    const m=l.me.total,o=l.op?l.op.total:0,d=m-o;
    return `<div class="lg"><div class="hd"><b>${esc(l.name)}</b><span>vs ${esc(l.opp)}</span></div>
      <div class="sc"><span class="me">${f1(m)}</span><span class="lead">${d>0?'+':''}${f1(d)}</span><span class="op">${f1(o)}</span></div>
      ${l.wp!=null?`<div class="wc">Win chance (estimate) <b>You ${Math.round(l.wp)}%</b></div>`:''}
      <div class="pl">${col(l.me,'me')}${col(l.op,'op')}</div></div>`;
  }).join('')||'<div class="empty">No matchups found for this week.</div>';
}
const openN=new Set();
function playStats(p,txt,hits){
  const out=hits.map(()=>({}));
  const raw=String(p.text||'').toLowerCase();
  if((/penalty/.test(raw)&&!/declined/.test(raw))||/no play|nullified/.test(raw))return out;
  const at=x=>{const i=txt.indexOf(x.n);if(i>=0)return i;const m=txt.match(x.ab);return m?m.index:-1};
  const pos=hits.map(at);
  const td=/touchdown/.test(raw),ym=raw.match(/for (-?\d+) yards?/),lm=raw.match(/loss of (\d+)/);
  const yd=ym?+ym[1]:lm?-lm[1]:0;
  const sk=txt.indexOf('sacked'),pi=txt.search(/\bpass\b/);
  if(sk>=0){
    hits.forEach((x,i)=>{if(pos[i]>=0&&pos[i]<sk)out[i].pass_sack=1});
  }else if(pi>=0){
    const ti=txt.indexOf(' to ',pi),inc=/incomplete/.test(raw),icp=/intercept/.test(raw);
    hits.forEach((x,i)=>{
      const s=out[i],a=pos[i];if(a<0||x.pos==='K')return;
      if(a<pi){s.pass_att=1;
        if(icp){s.pass_int=1;s.pass_inc=1}else if(inc)s.pass_inc=1;
        else{s.pass_cmp=1;s.pass_yd=yd;if(td)s.pass_td=1}}
      else if(ti>=0&&a>ti){s.rec_tgt=1;if(!inc&&!icp){s.rec=1;s.rec_yd=yd;if(td)s.rec_td=1}}
    });
  }else if(/rush/i.test(p.type?.text||'')||/\b(left|right) (end|tackle|guard)\b|up the middle|scrambles|rushes|kneel/.test(raw)){
    let b=-1;hits.forEach((x,i)=>{if(x.pos!=='K'&&pos[i]>=0&&(b<0||pos[i]<pos[b]))b=i});
    if(b>=0){const s=out[b];s.rush_att=1;s.rush_yd=yd;if(td)s.rush_td=1}
  }
  const good=/is good/.test(raw),fg=raw.match(/(\d+) yard field goal/);
  hits.forEach((x,i)=>{
    if(x.pos!=='K'||pos[i]<0)return;
    const s=out[i];
    if(fg){const d=+fg[1];
      if(good){s.fgm=1;s[d<20?'fgm_0_19':d<30?'fgm_20_29':d<40?'fgm_30_39':d<50?'fgm_40_49':d<60?'fgm_50_59':'fgm_60p']=1;if(d>=50&&d<60)s.fgm_50p=1}
      else s.fgmiss=1;
    }else if(/extra point/.test(raw))s[good?'xpm':'xpmiss']=1;
  });
  return out;
}
function fp(st,pos,sc){
  const ks=Object.keys(st);
  if(!sc||!ks.length)return null;
  let v=0;for(const k of ks)v+=st[k]*(sc[k]||0);
  if(st.rec)v+=st.rec*(sc['bonus_rec_'+String(pos||'').toLowerCase()]||0);
  return v;
}
function fpBlock(f,on,SC){
  const sg=v=>(v>0?'+':'')+v.toFixed(1);
  const g=f.ps.map(p=>{
    const rows=[],ix={};
    const add=(n,s)=>{const k=n+'|'+s;if(!(k in ix)){ix[k]=rows.length;rows.push({n,s,est:null,act:null})}return rows[ix[k]]};
    const hasSt=p.st&&Object.keys(p.st).length;
    p.yl.filter(on).forEach(n=>{const r=add(n,'me');if(hasSt)r.est=fp(p.st,p.pos,SC[n])});
    p.al.filter(on).forEach(n=>{const r=add(n,'op');if(hasSt)r.est=fp(p.st,p.pos,SC[n])});
    (f.pa||[]).filter(q=>q.name===p.name).forEach(q=>{const r=add(q.lg,q.s);r.act=(r.act||0)+q.d});
    const html=rows.filter(r=>r.est!==null||r.act!==null).map(r=>`<div class="fp ${r.s}"><span>${esc(r.n)}</span><b>${r.act!==null?sg(r.act)+(r.est!==null?` <small>est ${sg(r.est)}</small>`:''):`<small>est</small> ${sg(r.est)}`}</b></div>`).join('');
    return html?`<div class="fph">${esc(p.name)}</div>${html}`:'';
  }).join('');
  return g?`<details class="fpd" data-n="${f.n}"${openN.has(String(f.n))?' open':''}><summary>Fantasy points by league</summary>${g}</details>`:'';
}
$('#feed').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.n){d.open?openN.add(d.dataset.n):openN.delete(d.dataset.n)}},true);
function hasImpact(ps,on,SC){
  for(const p of ps){
    if(!p.st||!Object.keys(p.st).length)return true;
    for(const n of [...p.yl.filter(on),...p.al.filter(on)]){
      const v=fp(p.st,p.pos,SC[n]);
      if(v===null||Math.abs(v)>=0.05)return true;
    }
  }
  return false;
}
function renderFeed(){
  const now=Date.now(),cut=now-delay*1000,on=n=>!off.has(n),SC={};
  Ls.forEach(L=>SC[L.name]=L.sc);
  const sideOk=s=>ff==='all'||(ff==='mine'?s==='me':s==='op');
  const plays=feed.filter(f=>f.kind==='play'),att={},orph=[];
  for(const q of feed){
    if(q.kind!=='pts')continue;
    let best=null,bd=1e9;
    for(const pl of plays){
      const d=Math.abs(pl.t-q.t);
      if(d<=120000&&d<bd&&pl.ps.some(p=>p.name===q.name)){best=pl;bd=d}
    }
    if(best){if(q.t<=cut&&on(q.lg)&&sideOk(q.s))(att[best.n]??=[]).push(q)}
    else if(now-q.t>delay*1000+75000&&on(q.lg)&&sideOk(q.s))orph.push(q);
  }
  const shownPlays=plays.filter(f=>f.t<=cut).map(f=>{
    const ps=f.ps.map(p=>({...p,y:ff==='opp'?0:p.yl.filter(on).length,a:ff==='mine'?0:p.al.filter(on).length,yl:ff==='opp'?[]:p.yl,al:ff==='mine'?[]:p.al})).filter(p=>p.y||p.a);
    if(!ps.length)return null;
    const pa=att[f.n]||[];
    if(!pa.some(q=>Math.abs(q.d)>=0.05)&&!hasImpact(ps,on,SC))return null;
    return {...f,ps,pa};
  }).filter(Boolean);
  const vis=[...shownPlays,...orph].sort((a,b)=>b.t-a.t||b.n-a.n).slice(0,60);
  const sig=vis.map(f=>f.n+(f.pa?':'+f.pa.length:'')).join()+'|'+[...off].join()+'|'+ff;
  if(sig===lastSig)return;
  lastSig=sig;
  $('#feed').innerHTML=vis.length?vis.map(f=>{
    if(f.kind==='pts')return `<div class="f ${f.s}"><b>${f.d>0?'+':''}${f1(f.d)}</b>${esc(f.name)}<small>${esc(f.lg)} · ${clock(f.t)}</small></div>`;
    const tags=f.ps.map(p=>(p.y?`<span class="me">${esc(p.name)} · yours in ${p.y}</span>`:'')+(p.a?`<span class="op">${esc(p.name)} · against in ${p.a}</span>`:'')).join('');
    const lab=f.k==='td'?'<div class="lb">🏈🚨 TOUCHDOWN</div>':f.k==='fg'?'<div class="lb sm">🥅 FIELD GOAL</div>':'';
    return `<div class="play ${f.k}">${lab}<div class="pm">${esc([f.q+' '+f.clk,f.dd,f.sc].filter(s=>s.trim()).join(' · '))}</div><div class="pt">${esc(f.text)}</div><div class="tags">${tags}</div>${fpBlock(f,on,SC)}</div>`;
  }).join(''):'<div class="empty">Plays and score changes involving your players appear here after the delay.</div>';
}

function tick(){
  if(!snaps.length)return;
  const c=snaps.filter(s=>s.t<=Date.now()-delay*1000).pop();
  if(!c)$('#buf').textContent=`Buffering ${Math.max(0,Math.ceil((snaps[0].t+delay*1000-Date.now())/1000))}s…`;
  else{$('#buf').textContent='';if(c!==shown){diff(shown,c);shown=c;render(c)}}
  renderFeed();
}
setInterval(tick,1000);

$('#d').oninput=e=>{delay=+e.target.value;$('#dl').textContent=delay+'s';put('delay',delay);shown=null;lastSig='';tick()};
$('#wk').onchange=e=>{selWk=e.target.value;reset();poll()};
$('#go').onclick=init;
$('#u').onkeydown=e=>{if(e.key==='Enter')init()};
const qs=new URLSearchParams(location.search),qf=qs.get('feed'),qv=qs.get('view');
let vw=['feed','cards','both'].includes(qv)?qv:qf!==null?(qf==='1'?'feed':'both'):(get('vw')||(get('fo')==='1'?'feed':'both'));
function applyVw(){
  document.body.classList.toggle('feedonly',vw==='feed');
  document.body.classList.toggle('cardsonly',vw==='cards');
  document.querySelectorAll('#vw button').forEach(b=>b.classList.toggle('on',b.dataset.v===vw));
  lastSig='';
}
$('#vw').onclick=e=>{const b=e.target.closest('button');if(!b)return;vw=b.dataset.v;put('vw',vw);applyVw()};
applyVw();
let ff=get('ff')||'all';
function applyFf(){document.querySelectorAll('#ff button').forEach(b=>b.classList.toggle('on',b.dataset.f===ff));lastSig=''}
$('#ff').onclick=e=>{const b=e.target.closest('button');if(!b)return;ff=b.dataset.f;put('ff',ff);applyFf();renderFeed()};
applyFf();
init();
</script>
</body></html>
