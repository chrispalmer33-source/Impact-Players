<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game exposure</title>
<style>
:root{--bg:#0b1220;--card:#111b2e;--line:#22314d;--tx:#e8eefb;--mut:#8a9bb8;--me:#6cc4ff;--op:#ffb347}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;padding:14px;max-width:1100px;margin:auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
h1{font-size:22px;margin:0 8px 0 0}
input,button,select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit}
input[type=range]{padding:0;accent-color:var(--me);width:140px}
button{cursor:pointer}
.key{font-size:13px;color:var(--mut)}
#buf{color:var(--op);font-weight:600}#st{color:var(--mut);font-size:12px;margin-left:auto}
.picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.picker button{text-align:left;padding:6px 10px;line-height:1.3}
.picker button.on{border-color:var(--me)}
.picker small{display:block;color:var(--mut);font-size:11px}
.gh{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.gh .big{font-size:20px;font-weight:700}
.gh .sum{color:var(--mut);margin-top:2px}.me{color:var(--me)}.op{color:var(--op)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.teams{grid-template-columns:1fr}}
.teams h2{font-size:16px;margin:0 0 8px}
.teams h2.me{color:var(--me)}.teams h2.op{color:var(--op)}
.teams h2 small{color:var(--mut);font-weight:400;font-size:12px;margin-left:8px}
.pc.pm{border-left:3px solid var(--me)}.pc.po{border-left:3px solid var(--op)}
.tags .also{border-color:var(--line);color:var(--mut);border-style:dashed}
.pc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.r1{display:flex;gap:8px;align-items:baseline}
.r1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{color:var(--mut);font-size:12px}
.net{font-size:18px;font-weight:700;color:var(--mut)}.net.p{color:var(--me)}.net.n{color:var(--op)}
.tags span{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;margin:3px 6px 0 0;border:1px solid}
.tags .me{border-color:var(--me)}.tags .op{border-color:var(--op)}
.pts{margin-top:4px;font-size:13px;color:var(--mut)}.pts b{font-variant-numeric:tabular-nums}
details{margin-top:4px;font-size:12px}summary{cursor:pointer;color:var(--mut)}
.lr{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.lr span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mut);padding:10px 0}
</style></head>
<body>
<header>
  <h1>Game exposure</h1>
  <input id="u" value="chrispalmer33" aria-label="Sleeper username" autocomplete="off">
  <select id="wk" aria-label="Week"></select>
  <button id="go">Load</button>
  <label class="key">Delay <input id="d" type="range" min="0" max="180" step="5"> <b id="dl"></b></label>
  <span class="key"><b class="me">You</b> · <b class="op">Opponent</b></span>
  <span id="buf"></span><span id="st"></span>
</header>
<div id="picker" class="picker"></div>
<div id="gh"></div>
<div id="list"><div class="empty">Loading your leagues…</div></div>
<script>
const $=s=>document.querySelector(s),A='https://api.sleeper.app/v1',E='https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const j=async u=>{const r=await fetch(u);if(!r.ok)throw Error(r.status+' '+u);return r.json()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nt=t=>({WSH:'WAS',LAR:'LA'}[t]||t);
const get=k=>{try{return localStorage.getItem(k)}catch{return null}};
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const f1=v=>v.toFixed(1),sg=v=>(v>0?'+':'')+f1(v);
let players,user,Ls=[],snaps=[],shown=null,season=null,curWk=null,wk=null,selWk='auto',sel=null,pt,
    openP=new Set(),projC={w:0,t:0,m:{}},delay=+(get('delay')??45);
if(get('user'))$('#u').value=get('user');
$('#d').value=delay;$('#dl').textContent=delay+'s';
$('#wk').innerHTML='<option value="auto">Current week</option>'+Array.from({length:18},(_,i)=>`<option value="${i+1}">Week ${i+1}</option>`).join('');
const pn=pid=>{const p=players[pid]||{};return p.full_name||((p.first_name||'')+' '+(p.last_name||'')).trim()||pid};
const team=pid=>nt(players[pid]?.team);
const clock=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});
function reset(){snaps=[];shown=null;sel=null;wk=null}

async function getProj(w){
  if(projC.w===w&&Date.now()-projC.t<300000)return projC.m;
  try{const a=await j(`https://api.sleeper.com/projections/nfl/${season}/${w}?season_type=regular`);const m={};a.forEach(p=>m[p.player_id]=p.stats||{});projC={w,t:Date.now(),m}}
  catch{if(projC.w!==w)projC={w,t:Date.now()-240000,m:{}}}
  return projC.m;
}

async function init(){
  $('#st').textContent='Loading leagues…';
  try{
    const name=$('#u').value.trim();put('user',name);
    const st=await j(A+'/state/nfl');season=st.season;
    user=await j(`${A}/user/${name}`);
    const leagues=await j(`${A}/user/${user.user_id}/leagues/nfl/${season}`);
    players ||= await j(A+'/players/nfl');
    Ls=(await Promise.all(leagues.map(async L=>{
      const rs=await j(`${A}/league/${L.league_id}/rosters`);
      const me=rs.find(r=>r.owner_id===user.user_id||(r.co_owners||[]).includes(user.user_id));
      return me?{id:L.league_id,name:L.name,me:me.roster_id}:null;
    }))).filter(Boolean);
    reset();
    await poll();clearInterval(pt);pt=setInterval(poll,15000);
  }catch(e){$('#st').textContent='';$('#list').innerHTML=`<div class="empty">Couldn't load: ${esc(e.message)}. Check the username and your connection.</div>`}
}

async function poll(){
  try{
    const st=await j(A+'/state/nfl');season=st.season;curWk=st.display_week||st.week;
    const w=selWk==='auto'?curWk:+selWk;
    if(wk!==null&&w!==wk)reset();
    wk=w;
    const [sb]=await Promise.all([j(`${E}/scoreboard?seasontype=2&week=${w}`).catch(()=>null),getProj(w)]);
    const games=(sb?.events||[]).map(e=>{
      const c=e.competitions[0].competitors,h=c.find(x=>x.homeAway==='home'),a=c.find(x=>x.homeAway==='away');
      return {id:e.id,home:nt(h.team.abbreviation),away:nt(a.team.abbreviation),hs:h.score||'0',as:a.score||'0',state:e.status.type.state,detail:e.status.type.shortDetail,date:e.date};
    });
    const leagues=(await Promise.all(Ls.map(async L=>{
      const ms=await j(`${A}/league/${L.id}/matchups/${w}`);
      const mm=ms.find(m=>m.roster_id===L.me);
      if(!mm)return null;
      const op=mm.matchup_id&&ms.find(m=>m.matchup_id===mm.matchup_id&&m.roster_id!==L.me);
      const rows=m=>m?(m.starters||[]).filter(p=>p&&p!=='0').map(p=>[p,(m.players_points||{})[p]||0]):[];
      return {name:L.name,me:rows(mm),op:rows(op)};
    }))).filter(Boolean);
    const now=Date.now();
    snaps.push({t:now,games,leagues});
    snaps=snaps.filter(s=>s.t>now-300000);
    $('#st').textContent=`Week ${w} · ${Ls.length} leagues · polled ${clock(now)}`;
  }catch(e){$('#st').textContent='Fetch error: '+e.message}
}

function agg(c){
  const m={};
  for(const l of c.leagues)for(const [s,k] of [['me','yl'],['op','al']])for(const [pid,p] of l[s]){
    const e=m[pid]??={pid,yl:[],al:[]};e[k].push([l.name,p]);
  }
  return m;
}
const sum=a=>a.reduce((x,y)=>x+y[1],0);

function render(c){
  const m=agg(c),cnt={};
  for(const e of Object.values(m)){const t=team(e.pid);cnt[t]=(cnt[t]||0)+1}
  const n=g=>(cnt[g.home]||0)+(cnt[g.away]||0);
  if(!c.games.length){$('#picker').innerHTML='';$('#gh').innerHTML='';$('#list').innerHTML='<div class="empty">No games found for this week.</div>';return}
  if(!sel||!c.games.some(g=>g.id===sel))sel=(c.games.find(g=>g.state==='in'&&n(g))||c.games.find(g=>n(g))||c.games[0]).id;
  $('#picker').innerHTML=c.games.map(g=>`<button data-g="${g.id}" class="${g.id===sel?'on':''}"><b>${esc(g.away)}</b> ${g.state==='pre'?'at':`${esc(g.as)} – ${esc(g.hs)}`} <b>${esc(g.home)}</b><small>${esc(g.detail)} · ${n(g)} players</small></button>`).join('');
  const g=c.games.find(x=>x.id===sel);
  const list=Object.values(m).filter(e=>[g.home,g.away].includes(team(e.pid)));
  const ty=list.reduce((a,e)=>a+e.yl.length,0),ta=list.reduce((a,e)=>a+e.al.length,0);
  const py=list.reduce((a,e)=>a+sum(e.yl),0),pa=list.reduce((a,e)=>a+sum(e.al),0);
  const ny=list.filter(e=>e.yl.length).length,na=list.filter(e=>e.al.length).length;
  $('#gh').innerHTML=`<div class="gh"><div class="big">${esc(g.away)} ${g.state==='pre'?'at':`${esc(g.as)} – ${esc(g.hs)}`} ${esc(g.home)} <span class="pos">${esc(g.detail)}</span></div>
    <div class="sum">You own <b class="me">${ny}</b> players in <b class="me">${ty}</b> starting spots; you face <b class="op">${na}</b> players in <b class="op">${ta}</b>.
    Points so far: <b class="me">${f1(py)}</b> for you, <b class="op">${f1(pa)}</b> for opponents (summed across leagues).</div></div>`;
  const card=(e,s)=>{
    const p=players[e.pid]||{},mine=s==='me',arr=mine?e.yl:e.al,oth=mine?e.al:e.yl,pr=projC.m[e.pid]?.pts_half_ppr,k=e.pid+'-'+s;
    const rows=arr.map(([lg,v])=>`<div class="lr"><span>${esc(lg)}</span><b>${f1(v)}</b></div>`).join('');
    return `<div class="pc ${mine?'pm':'po'}"><div class="r1"><b>${esc(pn(e.pid))}</b><span class="pos">${esc(team(e.pid))} ${esc(p.position||'')}</span></div>
      <div class="tags"><span class="${s}">${mine?'yours':'against'} in ${arr.length}</span>${oth.length?`<span class="also">also ${mine?'against':'yours'} in ${oth.length}</span>`:''}</div>
      <div class="pts">${mine?'For you':'For opponents'} <b class="${s}">${f1(sum(arr))}</b>${pr!=null?` · proj ${f1(pr)} (½ PPR)`:''}</div>
      <details data-p="${esc(k)}"${openP.has(k)?' open':''}><summary>Points by league</summary>${rows}</details></div>`;
  };
  const col=s=>{
    const key=s==='me'?'yl':'al',ps=list.filter(e=>e[key].length).sort((a,b)=>b[key].length-a[key].length||sum(b[key])-sum(a[key])||pn(a.pid).localeCompare(pn(b.pid)));
    const spots=ps.reduce((a,e)=>a+e[key].length,0),pts=ps.reduce((a,e)=>a+sum(e[key]),0);
    return `<section><h2 class="${s}">${s==='me'?'Yours':'Against'}<small>${ps.length} players · ${spots} spots · ${f1(pts)} pts</small></h2>${ps.map(e=>card(e,s)).join('')||'<div class="empty">None in this game.</div>'}</section>`;
  };
  $('#list').innerHTML='<div class="teams">'+col('me')+col('op')+'</div>';
}

function tick(){
  if(!snaps.length)return;
  const c=snaps.filter(s=>s.t<=Date.now()-delay*1000).pop();
  if(!c){$('#buf').textContent=`Buffering ${Math.max(0,Math.ceil((snaps[0].t+delay*1000-Date.now())/1000))}s…`;return}
  $('#buf').textContent='';
  if(c!==shown){shown=c;render(c)}
}
setInterval(tick,1000);

$('#picker').onclick=e=>{const b=e.target.closest('button');if(!b)return;sel=b.dataset.g;shown=null;tick()};
$('#list').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.p){d.open?openP.add(d.dataset.p):openP.delete(d.dataset.p)}},true);
$('#d').oninput=e=>{delay=+e.target.value;$('#dl').textContent=delay+'s';put('delay',delay);shown=null;tick()};
$('#wk').onchange=e=>{selWk=e.target.value;reset();poll()};
$('#go').onclick=init;
$('#u').onkeydown=e=>{if(e.key==='Enter')init()};
init();
</script>
</body></html>
